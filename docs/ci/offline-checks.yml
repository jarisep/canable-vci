# SPDX-License-Identifier: Apache-2.0
name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/make_usb_vectors.py --check
      - run: python tools/make_j2534_cases.py --check
      - run: g++ -std=c++17 -O2 -pthread -I windows/include windows/tests/async_log_test.cpp -o /tmp/canable-log-test
      - run: /tmp/canable-log-test
  firmware-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: canable-vci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install west==1.5.0 cmake==4.4.4 ninja
      - run: west init -l canable-vci && west update
      - run: python -m pip install -r zephyr/scripts/requirements-base.txt
      - run: python canable-vci/tools/build_firmware.py --workspace . --target isotp-tests --build-dir build/isotp-tests
      - run: python canable-vci/tools/build_firmware.py --workspace . --target usb-tests --build-dir build/usb-tests
